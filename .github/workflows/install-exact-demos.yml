name: Install exact selected demos
on:
  push:
    paths:
      - '.github/workflows/install-exact-demos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exported exact app files
        env:
          ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-4cbc-81f5-8304-4b297010acce/raw?se=2026-09-13T04%3A39%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=d9677828-ca67-59c1-b76c-717b97713ba4&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T16%3A09%3A50Z&ske=2026-09-13T16%3A09%3A50Z&sks=b&skv=2026-02-06&sig=TquGY0NDrXkZgSQP/ttgqV2xt0Z21%2BIUGpETKBjYC5U%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/selected-demo-apps.zip
          rm -rf /tmp/demo-export
          mkdir -p /tmp/demo-export
          unzip -q /tmp/selected-demo-apps.zip -d /tmp/demo-export
          test "$(find /tmp/demo-export -maxdepth 1 -name '*.html' | wc -l)" -eq 76
      - name: Install exact live demo pages
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            slug="$(basename "$file" .html)"
            mkdir -p "demo/live/$slug"
            sed 's#dsa-logo.png#/DSA-logo-transparent-600x400.png#g' "$file" > "demo/live/$slug/index.html"
          done < <(find /tmp/demo-export -maxdepth 1 -name '*.html' | sort)
          python - <<'PY'
          from pathlib import Path
          p=Path('demo/category.js')
          s=p.read_text()
          old='href="/demo/live/?category=${slug}&amp;app=${a.slug}"'
          new='href="/demo/live/${a.slug}/"'
          if old not in s and new not in s:
              raise SystemExit('Expected demo link template not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit exact demos
        run: |
          set -euo pipefail
          git config user.name 'Digital Sellers Academy'
          git config user.email '311559434+DigitalSellersAcademy@users.noreply.github.com'
          git add demo/live demo/category.js
          git commit -m 'Use exact app files for category live demos'
          git push
