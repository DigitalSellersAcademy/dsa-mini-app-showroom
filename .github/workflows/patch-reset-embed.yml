name: Patch reset embed mode
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-reset-embed.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch embed mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/mindset-reset-tool/index.html')
          s = p.read_text()
          if "URLSearchParams(location.search).get('embed')" not in s:
              marker = "<style>"
              s = s.replace(marker, "<script>if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed');</script>" + marker, 1)
          if '.embed .top' not in s:
              s = s.replace('</style>', ".embed .top,.embed .back,.embed .cta,.embed .foot,.embed .backdemo{display:none!important}.embed .hero{padding:22px 0 18px}.embed .hero h1{font-size:clamp(30px,5vw,46px)}.embed .sub{font-size:14px}.embed .app{margin:0 auto 20px;box-shadow:none;border-radius:16px}.embed .shell{width:min(1040px,calc(100% - 20px))}@media(max-width:760px){.embed .hero{padding:16px 0 14px}.embed .panel{padding:18px}}</style>", 1)
          s = s.replace('class=\"btn ghost\" onclick=\"window.location.href=\\\'/demo/\\\'\">Back to Demos', 'class=\"btn ghost backdemo\" onclick=\"window.location.href=\\\'/demo/\\\'\">Back to Demos')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Digital Sellers Academy"
          git config user.email "311559434+DigitalSellersAcademy@users.noreply.github.com"
          git add demo/mindset-reset-tool/index.html
          git commit -m "Optimize reset demo embed mode" || exit 0
          git push